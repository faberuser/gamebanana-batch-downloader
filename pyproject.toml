[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamebanana-downloader"
version = "1.0.0"
description = "Download and archive GameBanana mods, categories, games, and submitters"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving",
]

[project.scripts]
gamebanana = "gamebanana_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
